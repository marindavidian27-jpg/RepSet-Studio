<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepSet Studio | High-Performance Digital Assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <style>
        :root {
            --charcoal: #121212;
            --dark-grey: #1a1a1a;
            --accent-red: #e63946;
            --text-white: #f8f9fa;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--charcoal);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2rem 10%; background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px); position: fixed; width: 100%; z-index: 1000;
        }

        .logo { font-weight: 900; font-size: 1.5rem; text-transform: uppercase; }
        .logo span { color: var(--accent-red); }

        header {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; padding: 0 10%; border-bottom: 1px solid #222;
        }

        header h1 { font-size: clamp(3.5rem, 12vw, 9rem); font-weight: 900; line-height: 0.85; text-transform: uppercase; }
        header h1 span {
            display: block; font-family: 'Ubuntu Condensed', sans-serif;
            font-style: italic; color: var(--accent-red); transform: skewX(-5deg);
            text-shadow: 5px 5px 0px rgba(230, 57, 70, 0.2);
        }

        .cta-btn {
            background-color: var(--accent-red); color: white;
            padding: 1.2rem 3rem; text-decoration: none; font-weight: 900;
            text-transform: uppercase; display: inline-block; width: fit-content;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(230, 57, 70, 0.3);
        }

        .cta-btn:hover { background-color: #ffffff; color: var(--charcoal); transform: scale(1.05); }

        .showcase { padding: 120px 10%; }
        .template-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem;
        }

        .template-card {
            background: var(--dark-grey); border: 1px solid #252525; padding: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .template-card:hover { border-color: var(--accent-red); transform: translateY(-10px); }

        .card-img {
            width: 100%; height: 200px; background: #111; margin-bottom: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #222; font-size: 2rem; border-bottom: 4px solid #222;
        }

        .card-price { font-weight: 900; color: var(--accent-red); font-size: 1.4rem; }

        footer { padding: 80px 10%; text-align: center; background: #000; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">RepSet<span>Studio</span></div>
    </nav>

    <header>
        <h1>Define Your<br><span>Performance</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem; max-width: 500px;">Engineered digital solutions for the modern creator.</p>
        <a href="#templates" class="cta-btn">Enter Studio</a>
    </header>

    <section class="showcase" id="templates">
        <div class="template-grid">
            <div class="template-card">
                <div class="card-img">VOL_01</div>
                <h3>Titan UI Kit</h3>
                <p style="color: var(--text-muted); margin: 1rem 0;">Ultimate dashboard architecture.</p>
                <span class="card-price">$49</span>
            </div>
            <div class="template-card">
                <div class="card-img">VOL_02</div>
                <h3>Rage Motion</h3>
                <p style="color: var(--text-muted); margin: 1rem 0;">Aggressive social media assets.</p>
                <span class="card-price">$29</span>
            </div>
        </div>
    </section>

    <footer>
        <div class="logo">REPSET<span>STUDIO</span></div>
        <p style="color: #444; font-size: 0.8rem; margin-top: 1rem;">&copy; 2026 REPSET STUDIO / NO COMPROMISE</p>
    </footer>
</body>
</html>
